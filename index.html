<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floria LaTeX</title>
<link rel="stylesheet" href="lib/codemirror/codemirror.css">
<link rel="stylesheet" href="lib/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css?v=20260925n">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111111'/><text x='50' y='68' font-size='52' text-anchor='middle' font-family='Georgia' fill='white'>F</text></svg>">
</head>
<body>

<!-- ============ 仪表盘 ============ -->
<div id="view-dashboard">
  <div class="dash-shell">
    <header class="dash-header">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div class="brand-text">
          <h1>本地书库</h1>
          <p class="brand-sub">项目目录下自动扫描 · 点击即开 · 保存写回磁盘</p>
        </div>
      </div>
      <div class="dash-actions">
        <label class="dash-search">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/>
          </svg>
          <input id="dl-search" type="text" placeholder="搜索书稿…" autocomplete="off" spellcheck="false">
        </label>
        <div class="view-toggle">
          <button class="icon-btn on" id="dl-view-list" title="列表视图" aria-pressed="true">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
              <path d="M2 4.2h12M2 8h12M2 11.8h12"/>
            </svg>
          </button>
          <button class="icon-btn" id="dl-view-grid" title="网格视图" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
              <rect x="2" y="2" width="5" height="5" rx="1.4"/><rect x="9" y="2" width="5" height="5" rx="1.4"/>
              <rect x="2" y="9" width="5" height="5" rx="1.4"/><rect x="9" y="9" width="5" height="5" rx="1.4"/>
            </svg>
          </button>
        </div>
        <button class="btn ghost" id="btn-refresh" title="重新扫描项目目录">刷新书库</button>
        <button class="btn primary" id="btn-new">＋ 新建书稿</button>
      </div>
    </header>
    <main class="dash-body">
      <section id="srv-section" class="hidden">
        <div id="srv-books"></div>
        <div id="dl-none" class="hidden">没有匹配的书稿</div>
      </section>
      <div id="dash-empty" class="dash-empty hidden">
        <div class="empty-mark">§</div>
        <p>书库里还没有书稿</p>
        <p class="empty-hint">点右上角「＋ 新建书稿」建一篇，或把「main.tex + 配图」的目录拷进项目根目录后点「刷新书库」</p>
      </div>
    </main>
    <div id="dl-menu" class="hidden">
      <button class="dl-mi" data-act="open">打开</button>
      <button class="dl-mi" data-act="copy">复制书稿名</button>
    </div>
  </div>
</div>

<!-- ============ 编辑器 ============ -->
<div id="view-editor" class="hidden">
  <header id="topbar">
    <!-- 常驻图标卡：不能被任何开关关掉，否则关掉「代码」后入口即消失 -->
    <div class="tb-seg" id="tb-panes">
      <button class="icon-btn" id="btn-panes" title="视图开关" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <rect x="1.4" y="2.4" width="13.2" height="11.2" rx="2.4"/>
          <path d="M5.9 2.4v11.2M10.1 2.4v11.2"/>
        </svg>
      </button>
    </div>
    <!-- 视图开关浮层 -->
    <div id="panes-panel" class="hidden">
      <div class="pn-row" data-pane="code" role="switch" aria-checked="true">
        <span>代码</span><span class="pn-switch"></span>
      </div>
      <div class="pn-row" data-pane="pdf" role="switch" aria-checked="true">
        <span>PDF</span><span class="pn-switch"></span>
      </div>
      <div class="pn-row" data-pane="ai" role="switch" aria-checked="false">
        <span>助手</span><span class="pn-switch"></span>
      </div>
    </div>

    <div class="tb-seg" id="tb-editor">
      <div class="tb-left">
        <button class="icon-btn" id="btn-back" title="返回项目列表">←</button>
        <div class="brand-mark small">F</div>
        <span id="proj-title" title="点击重命名">未命名</span>
      </div>
      <div class="tb-right">
        <button class="btn ghost slim" id="btn-outline-toggle">大纲</button>
        <button class="icon-btn" id="btn-theme" title="切换深浅色">☾</button>
      </div>
    </div>
    <div class="tb-seg hidden" id="tb-chat"><span class="tb-chat-name">助手</span></div>
  </header>

  <div id="workspace">
    <aside id="outline" class="hidden">
      <div class="outline-head">大纲</div>
      <nav id="outline-list"></nav>
    </aside>
    <div id="editor-pane">
      <textarea id="src"></textarea>
    </div>
    <div id="divider" title="拖动调整宽度"></div>
    <!-- 助手卡：一个节点三态（悬浮 .float / 收细条 .slim / 侧栏列卡），聊天本体 = 内嵌 Floria UI（js/chat.js） -->
    <div id="chat-pane" class="hidden">
      <div class="chat-head">
        <span class="chat-title">助手</span>
        <!-- 图标 = 内联 SVG（与 #btn-panes / 入口页视图开关同一套 16px 描线语言），不用字符字形 -->
        <span class="chat-head-actions">
          <button class="icon-btn hidden" id="chat-slim-btn" title="收成细条">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6.2 8 10.2 12 6.2"/>
            </svg>
          </button>
          <button class="icon-btn hidden" id="chat-dock-btn" title="收进侧栏">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="1.8" y="3" width="12.4" height="10" rx="2.2"/>
              <path d="M9.9 3v10"/>
            </svg>
          </button>
          <button class="icon-btn hidden" id="chat-undock-btn" title="浮到编辑区">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="1.8" y="5.8" width="8.4" height="8.4" rx="2.2"/>
              <path d="M6.6 1.8h5.4a2.2 2.2 0 0 1 2.2 2.2v5.4"/>
            </svg>
          </button>
          <button class="icon-btn" id="chat-close-btn" title="关掉助手">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8"/>
            </svg>
          </button>
        </span>
      </div>
      <div class="chat-grip" id="chat-grip" title="拖动调整大小"></div>
      <div id="chat-body"></div>
      <!-- 收敛态 = 一条输入栏（不是胶囊按钮）：点它回到悬浮卡 -->
      <button id="chat-pill" class="chat-pill" title="展开助手">
        <span class="cp-ph">随便提问</span>
        <span class="cp-arrow">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 12.6V3.8M4.4 7.4 8 3.8l3.6 3.6"/>
          </svg>
        </span>
      </button>
    </div>
    <!-- 助手列 ↔ 预览列的沟槽：只在「收进侧栏」时存在（panes.js 拖它改 --chat-w） -->
    <div id="divider-chat" class="hidden" title="拖动调整助手宽度"></div>
    <div id="preview-pane">
      <div id="pdf-wrap" class="hidden">
        <!-- PDF 卡内的两片浮条（Prism 同款：PDF 的东西全在 PDF 卡里，顶栏不放）
             顶 `#tb-pdf` = 编译态 + 缩放/下载；底 `#pdf-nav` = 翻页胶囊。
             容器 pointer-events:none，只有子件可点 —— 免得挡住点 PDF 跳源码。 -->
        <div id="tb-pdf" class="hidden">
          <button id="pdf-state" class="pv-state st-none" title="编译 / 刷新">未编译</button>
          <div id="tb-view">
            <div class="pv-zoomwrap">
              <button id="pdf-zoom-toggle" title="缩放"><span id="pdf-zoom-label">适宽</span><span class="zcaret">▾</span></button>
              <div id="zoom-panel" class="hidden">
                <div class="zp-row">
                  <button data-zoom="fit">适宽</button>
                  <button data-zoom="fitpage">适页</button>
                </div>
                <div class="zp-row">
                  <button data-zoom="0.5">50%</button>
                  <button data-zoom="0.75">75%</button>
                  <button data-zoom="1">100%</button>
                  <button data-zoom="1.25">125%</button>
                  <button data-zoom="1.5">150%</button>
                  <button data-zoom="2">200%</button>
                </div>
                <div class="zp-slider">
                  <input type="range" id="pdf-zoom-range" min="40" max="300" step="5" value="100">
                  <span id="pdf-zoom-val">适宽</span>
                </div>
              </div>
            </div>
            <button class="icon-btn chip" id="pdf-download" title="下载 PDF">⭳</button>
          </div>
        </div>
        <div id="pdf-scroll"><div id="pdf-pages"></div></div>
        <div id="pdf-nav">
          <div class="pv-caps">
            <button id="pdf-prev" title="上一页">‹</button>
            <span id="pdf-page-ind">– / –</span>
            <button id="pdf-next" title="下一页">›</button>
          </div>
        </div>
      </div>
      <div id="paper"></div>
    </div>
  </div>

</div>

<!-- AI 助手：2026-09-17 整体移除 → 2026-09-25 按 Prism 形态加回（左上角开关 #tb-panes / #panes-panel）
     → 2026-09-25 改三态卡（悬浮 / 细条 / 侧栏）+ 内嵌真 Floria UI（js/chat.js） -->

<div id="toast" class="hidden"></div>

<script src="lib/codemirror/codemirror.js"></script>
<script src="lib/codemirror/mode/stex/stex.js"></script>
<script src="lib/codemirror/addon/selection/active-line.js"></script>
<script src="lib/codemirror/addon/edit/closebrackets.js"></script>
<script src="lib/codemirror/addon/edit/matchbrackets.js"></script>
<script src="lib/katex/katex.min.js"></script>
<script src="lib/pdfjs/pdf.min.js"></script>
<script src="js/renderer.js?v=20260914b"></script>
<script src="js/pdfview.js?v=20260925d"></script>
<script src="js/core.js?v=20260925g"></script>
<script src="js/panes.js?v=20260925k"></script>
<script src="js/editor.js?v=20260925h"></script>
<script src="js/pdf.js?v=20260925f"></script>
<script src="js/books.js?v=20260925f"></script>
<script src="js/chat.js?v=20260925l"></script>
<script src="js/boot.js?v=20260925g"></script>
</body>
</html>
